نننننننننننننن@if (memberIn) {
<article class="member-card">
  <div class="card-header" [routerLink]="['/members/' + memberIn.userName]">
    @if (memberIn.photos.length === 0) {
      <img
        src="synq.jpeg"
        alt="{{ memberIn.userName }}"
        class="profile-img fallback"
        loading="lazy"
      />
    } @else {
      @for (photo of memberIn.photos; track $index) {
        @if (photo.isMain) {
          <img
            [src]="apiUrl + photo.url_165"
            alt="{{ memberIn.userName }}"
            class="profile-img"
            loading="lazy"
          />
        }
      }
    }

    <div class="overlay"></div>

    <span class="location-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      {{ memberIn.city || 'Global' }}
    </span>
  </div>

  <div class="card-body" [routerLink]="['/members/' + memberIn.userName]">
    <div class="user-row">
      <h3 class="username" title="{{ memberIn.userName }}">
        {{ memberIn.userName }}
      </h3>
      <span class="meta-data">{{ memberIn.age }} Age</span>
    </div>

    <div class="status-row">
      <span class="online-pill">
        <span class="dot"></span>
        Active
      </span>
      <span class="arrow-hint">View →</span>
    </div>
  </div>
</article>
}
