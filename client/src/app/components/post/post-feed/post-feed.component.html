<div class="feed-container">
  <!-- LOADING SKELETON -->
  <div *ngIf="loading" class="feed-loading">
    <div class="skeleton-card" *ngFor="let i of [1, 2, 3]">
      <div class="skeleton-header">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-lines">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line very-short"></div>
        </div>
      </div>
      <div class="skeleton-content">
        <div class="skeleton-line"></div>
        <div class="skeleton-line half"></div>
      </div>
    </div>
  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="!loading && posts.length === 0" class="empty-feed">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>
    <h3>No posts yet</h3>
    <p>Be the first one to share an update on the feed!</p>
  </div>

  <!-- POST LIST -->
  <div *ngIf="!loading && posts.length > 0" class="posts-list">
    <article class="post-card" *ngFor="let post of posts; trackBy: trackByPost">
      <header class="post-header">
        <div class="avatar">
          {{ (post.userName ? post.userName[0] : 'U') | uppercase }}
        </div>

        <div class="user-meta">
          <span class="username">{{ post.userName }}</span>
          <span class="post-time">{{ getRelativeTime(post.createdAt) }}</span>
        </div>
      </header>

      <div class="post-content">
        {{ post.caption }}
      </div>

      <footer class="post-actions">
        <button type="button" class="action-btn" title="Comments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
          </svg>
          <span class="count">Reply</span>
        </button>

        <button type="button" class="action-btn like-btn" title="Like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
          </svg>
          <span class="count">Like</span>
        </button>

        <button type="button" class="action-btn" title="Share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </footer>
    </article>
  </div>
</div>
